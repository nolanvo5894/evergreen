# Start Evergreen (with the Amazon framework stopped) as the device shell,
# once per boot; falls back to stock KOReader when Evergreen isn't installed.
#
# Disable without touching this file: create /mnt/us/NO_AUTOSTART (USB drive root).
# Remove: mntroot rw; rm /etc/upstart/kshell.conf; mntroot ro
# Exiting KOReader always returns to the Amazon UI.

start on framework_ready
task

script
    # framework_ready fires again whenever the framework restarts (e.g. after
    # KOReader exits); only act on the first one after boot. /tmp is a tmpfs.
    FLAG=/tmp/koreader_autostarted
    [ -f "$FLAG" ] && exit 0

    # the user store (/mnt/us) can come up after framework_ready
    i=0
    while [ ! -d /mnt/us/documents ] && [ $i -lt 120 ]; do
        sleep 1
        i=$((i + 1))
    done
    if [ -f /mnt/us/evergreen/koreader.sh ]; then
        APP=evergreen
    elif [ -f /mnt/us/koreader/koreader.sh ]; then
        APP=koreader
    else
        exit 0
    fi
    [ -f /mnt/us/NO_AUTOSTART ] && exit 0
    touch "$FLAG"

    echo "$(date) kshell: launching $APP (waited ${i}s)" >> /mnt/us/autostart.log
    /usr/bin/setsid /bin/sh -c "sleep 3; /var/local/kmc/bin/kpm launch $APP --framework_stop >> /mnt/us/autostart.log 2>&1" \
        < /dev/null > /dev/null 2>&1 &
end script
