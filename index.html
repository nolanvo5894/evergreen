<h1>Evergreen</h1>
<p>A KOReader fork for jailbroken Kindles. Source: <a href="https://github.com/nolanvo5894/evergreen">github.com/nolanvo5894/evergreen</a> (AGPL-3.0).</p>
<p>Install from the Kindle home-screen search bar:</p>
<pre><code>;kpm add-repo https://nolanvo5894.github.io/evergreen/manifest.v2.json
;kpm update
;kpm install evergreen</code></pre>
